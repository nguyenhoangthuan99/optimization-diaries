<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Step 3 — register tiling: one thread computes a 2×2 C tile</text>

  <!-- A -->
  <rect x="70" y="200" width="180" height="260" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="160" y="188" text-anchor="middle" font-size="15" fill="#374151">A</text>
  <rect x="70" y="300" width="60" height="45" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="73" y="326" font-size="12" font-weight="700" fill="#1d4ed8">a0</text>
  <rect x="70" y="345" width="60" height="45" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="73" y="371" font-size="12" font-weight="700" fill="#1d4ed8">a1</text>
  <text x="70" y="487" font-size="12" fill="#374151">2 rows of A</text>

  <!-- B -->
  <rect x="310" y="90" width="440" height="70" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="530" y="80" text-anchor="middle" font-size="15" fill="#374151">B</text>
  <rect x="470" y="90" width="80" height="35" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="473" y="112" font-size="12" font-weight="700" fill="#15803d">b0</text>
  <rect x="470" y="125" width="80" height="35" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="473" y="147" font-size="12" font-weight="700" fill="#15803d">b1</text>
  <text x="310" y="176" font-size="12" fill="#374151">2 columns of B</text>

  <!-- C block with 2x2 -->
  <rect x="310" y="200" width="440" height="260" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="530" y="188" text-anchor="middle" font-size="15" fill="#374151">C tile owned by one thread</text>
  <rect x="360" y="260" width="120" height="55" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="365" y="290" font-size="12" font-weight="700" fill="#b91c1c">c00</text>
  <rect x="480" y="260" width="120" height="55" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="485" y="290" font-size="12" font-weight="700" fill="#b91c1c">c01</text>
  <rect x="360" y="315" width="120" height="55" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="365" y="345" font-size="12" font-weight="700" fill="#b91c1c">c10</text>
  <rect x="480" y="315" width="120" height="55" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="485" y="345" font-size="12" font-weight="700" fill="#b91c1c">c11</text>

  <!-- equation -->
  <text x="530" y="410" text-anchor="middle" font-size="13" fill="#374151">c00 += a0·b0     c01 += a0·b1</text>
  <text x="530" y="432" text-anchor="middle" font-size="13" fill="#374151">c10 += a1·b0     c11 += a1·b1</text>
  <text x="530" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">4 FMAs, but only 2 A + 2 B loads</text>

  <!-- arrows from A/B regs to C -->
  <g stroke="#9ca3af" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <line x1="130" y1="322" x2="360" y2="322"/><line x1="130" y1="367" x2="360" y2="367"/>
    <line x1="510" y1="125" x2="420" y2="260"/><line x1="550" y1="125" x2="540" y2="260"/>
  </g>

  <text x="500" y="560" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">the C tile lives in registers, not memory — it is read/written once for the whole K loop</text>
  <text x="500" y="584" text-anchor="middle" font-size="14" fill="#374151">each loaded A value feeds 2 FMAs, each loaded B value feeds 2 → arithmetic intensity jumps</text>
  <text x="500" y="608" text-anchor="middle" font-size="14" fill="#6d28d9">bigger tiles (e.g. 8×4) amortize each load over more FMAs, at the cost of more registers</text>
</svg>
